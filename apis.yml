name: Transbnk
description: 'TransBnk — rebranded as TBX — is an Indian open-finance and transaction-banking
  infrastructure company founded in 2022 and headquartered in Mumbai. It gives banks,
  enterprises, fintechs, corporates, and NBFCs the platforms, APIs, and connected
  workflows behind corporate banking: mandate management, escrow flows, virtual accounts,
  reconciliation, lending acceleration, and cash and treasury management. TransBnk
  reports partnerships with 25+ banks, 200+ APIs extended, 100+ BFSI clients, and
  50M+ transactions processed. Products include TxB Hub (transaction banking),
  TrustHub (core banking and escrow), and the API Hub integration surface. The
  company is backed by Bessemer Venture Partners, 8i Ventures, and Accion Venture Lab.'
